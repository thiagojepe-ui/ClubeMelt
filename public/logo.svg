<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <mask id="melt-bite">
      <rect x="0" y="0" width="100" height="100" fill="white"/>
      <circle cx="62.5" cy="21.5" r="6.2" fill="black"/>
      <circle cx="60.5" cy="32.5" r="5.6" fill="black"/>
    </mask>
  </defs>

  <!-- Cream badge -->
  <circle cx="50" cy="50" r="50" fill="#F9E9D2"/>

  <!-- Bitten cookie line art -->
  <g mask="url(#melt-bite)">
    <circle cx="49" cy="27.5" r="12.5" stroke="#4A2C17" stroke-width="2.6" fill="none"/>
  </g>
  <!-- Chocolate chips -->
  <circle cx="44" cy="21.5" r="1.8" fill="#4A2C17"/>
  <circle cx="52.5" cy="20" r="1.5" fill="#4A2C17"/>
  <circle cx="43.5" cy="30.5" r="1.6" fill="#4A2C17"/>
  <circle cx="51" cy="34.5" r="1.7" fill="#4A2C17"/>
  <circle cx="55" cy="28" r="1.3" fill="#4A2C17"/>

  <!-- Wordmark -->
  <text x="50" y="67" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" letter-spacing="1.5" fill="#4A2C17">MELT</text>
  <text x="50" y="80.5" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.4" font-weight="600" letter-spacing="2.8" fill="#4A2C17">COOKIES</text>
</svg>
